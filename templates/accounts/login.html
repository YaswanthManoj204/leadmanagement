{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LeadFlow CRM</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      max-width: 440px;
      width: 100%;
      border-radius: 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      background: #ffffff;
    }
  </style>
</head>
<body>

<div class="login-card p-4 p-sm-5">
  <div class="text-center mb-4">
    <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-4 p-3 mb-3 shadow">
      <i class="bi bi-funnel-fill fs-2"></i>
    </div>
    <h3 class="fw-bold text-dark mb-1">LeadFlow CRM</h3>
    <p class="text-muted small">Sign in to manage leads, follow-ups & conversions</p>
  </div>

  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show small" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}

  <form method="POST" action="">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label small fw-semibold text-secondary">Username</label>
      <div class="input-group">
        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
        <input type="text" name="username" id="id_username" class="form-control bg-light border-start-0" placeholder="Enter username" required autofocus>
      </div>
    </div>

    <div class="mb-4">
      <div class="d-flex justify-content-between align-items-center">
        <label class="form-label small fw-semibold text-secondary">Password</label>
      </div>
      <div class="input-group">
        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
        <input type="password" name="password" id="id_password" class="form-control bg-light border-start-0" placeholder="••••••••" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
      <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
    </button>
  </form>

  <!-- Quick Demo Credentials Box -->
  <div class="bg-light p-3 rounded-3 border mt-3">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <span class="badge bg-secondary-subtle text-secondary fw-semibold">Demo Quick Login</span>
      <small class="text-muted" style="font-size: 0.75rem;">Click to fill</small>
    </div>
    <div class="d-grid gap-2">
      <button type="button" class="btn btn-outline-primary btn-sm text-start d-flex justify-content-between align-items-center" onclick="fillDemo('admin', 'admin123')">
        <span><i class="bi bi-shield-lock-fill me-1"></i> <strong>Admin</strong> (All leads, analytics & users)</span>
        <span class="badge bg-primary">admin</span>
      </button>
      <button type="button" class="btn btn-outline-secondary btn-sm text-start d-flex justify-content-between align-items-center" onclick="fillDemo('vikram_sales', 'sales123')">
        <span><i class="bi bi-person-badge-fill me-1"></i> <strong>Salesperson</strong> (Assigned leads & follow-ups)</span>
        <span class="badge bg-secondary">vikram_sales</span>
      </button>
    </div>
  </div>

  <div class="text-center mt-4">
    <small class="text-muted">Multi-user Role-Based Permissions & Centralized Database</small>
  </div>
</div>

<script>
  function fillDemo(username, password) {
    document.getElementById('id_username').value = username;
    document.getElementById('id_password').value = password;
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
